services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-service_app}
      - POSTGRES_USER=${POSTGRES_USER:-service_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - service-network
    restart: unless-stopped

  app:
    build: .
    image: service-app:latest
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-service-tecnico-dev}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-service_app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-service_app}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      # PDF generados (carpeta visible en tu PC).
      - ./documentos:/app/documentos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - service-network
    restart: unless-stopped

networks:
  service-network:
    driver: bridge

volumes:
  # Archivos de la base de datos PostgreSQL (administrados por Docker).
  db_data:
