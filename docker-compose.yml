services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-service_app}
      - POSTGRES_USER=${POSTGRES_USER:-service_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - service-network
    restart: unless-stopped

  app:
    build: .
    image: service-app:latest
    ports:
      # Solo accesible desde esta PC. Para ponerlo en línea NO abras este puerto:
      # se publica detrás de un proxy con HTTPS (ver README, "Puesta en línea").
      - "127.0.0.1:5000:5000"
    environment:
      # development (por defecto) o production. En production: SECRET_KEY obligatoria,
      # cookies solo por HTTPS y no se crea el admin por defecto (admin/admin).
      - APP_ENV=${APP_ENV:-development}
      # Clave que firma las sesiones. Vacía = se genera sola (solo en development).
      - SECRET_KEY=${SECRET_KEY:-}
      # Admin inicial (opcional). Sin ADMIN_PASSWORD, en development se crea admin/admin
      # y obliga a cambiar la contraseña en el primer ingreso.
      - ADMIN_USUARIO=${ADMIN_USUARIO:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Cantidad de proxies delante de la app (1 si hay Caddy/nginx). 0 = ninguno.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-0}
      # Cookies solo por HTTPS. Por defecto: sí en production, no en development.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-service_app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-service_app}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      # PDF generados (carpeta visible en tu PC).
      - ./documentos:/app/documentos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - service-network
    restart: unless-stopped

networks:
  service-network:
    driver: bridge

volumes:
  # Archivos de la base de datos PostgreSQL (administrados por Docker).
  db_data:
